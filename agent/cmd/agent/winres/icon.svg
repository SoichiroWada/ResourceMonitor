<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202a"/><stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)" stroke="#334155" stroke-width="4"/>
  <!-- 0%(200°)〜80% のシアン、80%〜100%(−20°) の赤。中心 (128,150) 半径 90 -->
  <path d="M 43.4 180.8 A 90 90 0 0 1 210.2 113.4" fill="none" stroke="url(#cy)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 210.2 113.4 A 90 90 0 0 1 212.6 180.8" fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  <!-- 針（約 65%） -->
  <polygon points="122,146 168,88 134,154" fill="#e0f7ff" filter="url(#glow)"/>
  <circle cx="128" cy="150" r="17" fill="#0b1015" stroke="#cbd5e1" stroke-width="6"/>
</svg>
